name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test

      # The CoFID loader (standard-library Python) that generates the
      # reference_foods data migration.
      - name: Test CoFID loader
        run: python3 -m unittest discover -s tool/cofid

  build-windows:
    # Checks the desktop app still builds without the Android-only plugins
    # (Health Connect, barcode scanning) and with the runner's URL scheme
    # code, then that the installer still compiles. Built without Supabase
    # settings, which the app handles by showing its setup screen.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build
        run: flutter build windows --release

      # Inno Setup isn't on GitHub's Windows images. Pinned to one release
      # from its official GitHub releases and checked against the SHA-256
      # in winget's manifest before it runs. To update, change both lines.
      - name: Install Inno Setup
        shell: pwsh
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup hash mismatch: $hash" }
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }

      # Checks the installer script still compiles against the release
      # folder. Not uploaded: CI builds without Supabase settings, so this
      # installer's app would only show its setup screen.
      - name: Build installer
        shell: pwsh
        run: ./tool/build_windows_installer.ps1 -SkipBuild

  database:
    # Applies every migration to a throwaway local Supabase database, then
    # runs the pgTAP tests in supabase/tests (allowlist lock-down, RLS on
    # every public table). Nothing here touches the real project.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.3.0

      - name: Start database
        run: supabase db start

      - name: Test database
        run: supabase test db
