name: trendline
description: "Weight-loss and meal-planning app"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.14.0

# Versions are locked by the committed pubspec.lock. Review any new package
# (maintainer, activity, licence) before adding it, and say why it's needed.
dependencies:
  # Save dialog for the data export (Android's document picker, no storage
  # permission; Windows' save dialog). Publisher: victorcarreras.dev, MIT.
  file_picker: ^13.4.1
  # Weight trend chart (publisher: flchart.dev, MIT).
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  # State management and in-memory cache (publisher: dash-overflow.net, MIT).
  flutter_riverpod: ^3.5.0
  # Encrypted storage for the auth session (publisher: steenbakker.dev,
  # BSD-3). Auth tokens must never sit in plain storage.
  flutter_secure_storage: ^11.2.0
  # Health Connect reads (weight, body fat, lean mass), Android only; used only
  # inside lib/platform/android (publisher: carp.dk, MIT). Pinned exactly:
  # every update gets a changelog review and a real-device test first.
  health: 14.0.0
  # HTTP for the Open Food Facts API (publisher: dart.dev, BSD-3).
  http: ^1.6.0
  # Date and number formatting (publisher: dart.dev, BSD-3).
  intl: ^0.20.3
  # Material widgets, split out of the Flutter SDK in 3.50 (publisher:
  # flutter.dev).
  material_ui: ^1.11.1
  # @immutable for pure-Dart domain classes (publisher: dart.dev, BSD-3).
  meta: ^1.19.0
  # Barcode scanning, Android only; used only inside lib/platform/android
  # (publisher: steenbakker.dev, BSD-3).
  mobile_scanner: ^7.5.0
  # Supabase client: database, auth, Discord OAuth (publisher: supabase.io,
  # MIT).
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Lint rules (publisher: verygood.ventures, MIT). Pinned exactly so that new
  # lints arrive through a reviewed Dependabot PR, not a surprise CI failure.
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  assets:
    # The built-in recipe library (see lib/domain/recipe_library.dart).
    - assets/recipe_library.json
    # Dish templates and flavour profiles (see lib/domain/dish_templates.dart).
    - assets/dish_templates.json
